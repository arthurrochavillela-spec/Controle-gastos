<title>Controle de Gastos</title>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F6F6F4;
    --surface-2:#EEEEEA;
    --border:#DEDEDA;
    --text:#1C1E24;
    --text-dim:#6B6F78;
    --ok:#2F8F76;
    --warn:#B8790E;
    --over:#C23B30;
    --accent:#4B57C4;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));}

  .banner{background:#FFF6E0;border:1px solid #C98A1E;color:#8A5A0E;font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:16px;line-height:1.4;}

  /* header */
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;row-gap:10px;}
  .header h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin:0;}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0;}
  .month-nav button:hover{background:var(--surface-2);}
  .month-label{font-family:var(--mono);font-size:12px;min-width:150px;text-align:center;white-space:nowrap;}

  /* gauge */
  .gauge-wrap{margin:20px 0 8px;}
  .gauge{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface);border:1px solid var(--border);}
  .gauge-seg{height:100%;}
  .gauge-fixed{background:repeating-linear-gradient(45deg,#767B87,#767B87 4px,#6B707A 4px,#6B707A 8px);}
  .totals{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);}
  .totals .item{text-align:left;}
  .totals .item .label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
  .totals .item .value{font-size:19px;font-weight:600;}
  .totals .remaining.neg{color:var(--over);}
  .totals .remaining.pos{color:var(--ok);}

  section{margin-top:28px;}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .section-title h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:0;font-weight:600;}
  .link-btn{background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
  .link-btn:hover{color:var(--text);}

  /* chart cards */
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:7px;}
  .legend-row{display:flex;align-items:center;gap:6px;font-size:12px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .legend-icon{font-size:13px;flex-shrink:0;}
  .legend-name{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend-val{font-family:var(--mono);color:var(--text-dim);font-size:11px;white-space:nowrap;}

  /* category cards */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){.cat-grid{grid-template-columns:1fr;}}
  .cat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .cat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
  .cat-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-nums{font-family:var(--mono);font-size:12px;color:var(--text-dim);flex-shrink:0;}
  .cat-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:4px;}
  .cat-bar-fill{height:100%;transition:width .2s;}
  .cat-remain{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .empty{color:var(--text-dim);font-size:13px;border:1px dashed var(--border);border-radius:10px;padding:18px;text-align:center;}

  /* fixed list */
  .fixed-list{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .fixed-row{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);}
  .fixed-row:last-child{border-bottom:none;}
  .fixed-row .amt{font-family:var(--mono);color:var(--text-dim);}

  /* form */
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .form-row{display:flex;gap:8px;flex-wrap:wrap;}
  .form-row select,.form-row input{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:11px 10px;font-family:var(--sans);font-size:16px;
  }
  .form-row select{flex:1;min-width:120px;}
  .form-row input[type=number]{width:110px;font-family:var(--mono);}
  .form-row input[type=text]{flex:1;min-width:120px;}
  .form-row input[type=date]{width:150px;font-family:var(--mono);}
  .submit-btn{background:var(--ok);border:none;color:#0f1712;font-weight:600;padding:11px 16px;border-radius:6px;cursor:pointer;font-size:14px;min-height:44px;}
  .submit-btn:hover{opacity:.9;}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed;}
  .field-error{color:var(--over);font-size:12px;margin-top:6px;display:none;}
  .field-error.show{display:block;}
  @media(max-width:480px){
    .form-row select,.form-row input[type=text]{flex-basis:100%;}
    .form-row input[type=number],.form-row input[type=date]{flex:1;width:auto;min-width:100px;}
    .submit-btn{flex-basis:100%;}
  }

  /* transactions */
  .tx-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .tx-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:10px 14px;font-size:13px;}
  .tx-left{display:flex;flex-direction:column;gap:2px;flex:1;cursor:pointer;}
  .tx-cat{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
  .tx-right{display:flex;align-items:center;gap:4px;}
  .tx-amt{font-family:var(--mono);}
  .tx-del,.tx-edit{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:10px;min-width:40px;min-height:40px;}
  .tx-del:hover{color:var(--over);}
  .tx-edit:hover{color:var(--text);}
  .tx-edit-form{background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
  .tx-edit-form .form-row select,.tx-edit-form .form-row input{font-size:16px;}
  .tx-edit-actions{display:flex;gap:8px;justify-content:flex-end;}
  .tx-edit-actions button{border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .tx-edit-actions .save-btn{background:var(--ok);border:none;color:#0f1712;font-weight:600;}

  /* icon picker */
  .icon-picker-wrap{position:relative;flex-shrink:0;}
  .icon-btn{width:42px;height:42px;font-size:20px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;line-height:1;}
  .icon-grid{position:absolute;z-index:30;top:46px;left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;width:230px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .icon-opt{font-size:19px;background:none;border:none;cursor:pointer;border-radius:6px;padding:7px;min-width:36px;min-height:36px;}
  .icon-opt:hover{background:var(--surface-2);}

  /* color picker */
  .color-picker-wrap{position:relative;flex-shrink:0;}
  .color-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;}
  .color-grid{position:absolute;z-index:30;top:38px;left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:180px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .color-opt{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
  .color-opt:hover{border-color:var(--text-dim);}
  .cat-color-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;flex-shrink:0;}

  /* settings (categories tab) */
  .settings-block{margin-bottom:22px;}
  .settings-block:last-child{margin-bottom:0;}
  .settings-block h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0 0 8px;}
  .settings-item{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .settings-item input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 8px;font-size:16px;}
  .settings-item .sname{flex:1;min-width:110px;}
  .settings-item .slimit{width:100px;font-family:var(--mono);}
  .settings-item button.del-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:8px;min-width:36px;min-height:36px;}
  .settings-item button.del-btn:hover{color:var(--over);}
  .add-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .add-row input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 8px;font-size:16px;}
  .add-row .aname{flex:1;min-width:110px;}
  .add-row .alimit{width:100px;font-family:var(--mono);}
  .add-row button.add-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;cursor:pointer;font-size:13px;min-height:40px;}
  .add-row button.add-btn:hover{background:#2A2F38;}

  .backup-row{display:flex;gap:8px;margin-top:6px;}
  .backup-row button{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:10px;cursor:pointer;font-size:12px;min-height:40px;}
  .backup-row button:hover{background:#2A2F38;}

  .status{font-size:12px;color:var(--text-dim);text-align:center;margin-top:24px;min-height:16px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--over);}
  .loading{color:var(--text-dim);text-align:center;padding:60px 0;font-family:var(--mono);font-size:13px;}

  /* tab bar */
  .tab-bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10;max-width:760px;margin:0 auto;}
  .tab-btn{flex:1;background:none;border:none;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;cursor:pointer;border-radius:8px;min-height:48px;}
  .tab-btn.active{color:var(--accent);}
  .tab-icon{font-size:19px;}
  .tab-label{font-size:10px;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Carregando...</div>
</div>

<script>
const MONTH_ABBR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CAT_COLORS = ['#2F8F76','#3D6FC4','#B8790E','#8C5FC0','#C23B30','#1F8FA3','#B8722E','#5B9B4A','#C24A8C','#6B6FD1','#5A8F3D','#A34F3D'];
const CYCLE_START_DAY = 10; // ciclo vai do dia 10 ao dia 9 do mês seguinte
const EMOJI_CHOICES = ['🍔','🛒','🚗','🏠','💊','🎮','🎬','🍺','☕','👕','📱','💡','🚌','✈️','🏋️','💇','🐾','🎓','📚','🎁','🔧','🎵','🏥','🛠️','💳','🏦','🚕','🍕','🧴','🌐','📶','🎨','🏷️','📌','🧾','🐶'];
const DEFAULT_CAT_ICON = '🏷️';
const DEFAULT_FIXED_ICON = '📌';

let config = { categories: [], fixed: [] };
let txByMonth = {}; // cache: {cycle: [tx]}
const REAL_CURRENT_CYCLE = cycleKey(new Date()); // âncora fixa: não muda ao navegar entre ciclos
let currentMonth = REAL_CURRENT_CYCLE;
let currentTab = 'overview'; // 'overview' | 'log' | 'categories'
let editingTxId = null;
let iconPickerFor = null;
let colorPickerFor = null;
let pendingNewCatIcon = DEFAULT_CAT_ICON;
let pendingNewFixedIcon = DEFAULT_FIXED_ICON;
let pendingNewCatColor = CAT_COLORS[0];

// ---------- ciclo (dia 10 a dia 9) ----------
function cycleKey(d){
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() < CYCLE_START_DAY){
    m -= 1;
    if(m < 0){ m = 11; y -= 1; }
  }
  return y + '-' + String(m+1).padStart(2,'0');
}
function cycleLabel(key){
  const [y,m] = key.split('-').map(Number);
  let endM = m+1, endY = y;
  if(endM > 12){ endM = 1; endY += 1; }
  const start = CYCLE_START_DAY + ' ' + MONTH_ABBR[m-1];
  const end = (CYCLE_START_DAY-1) + ' ' + MONTH_ABBR[endM-1] + ' ' + endY;
  return start + ' – ' + end;
}
function shortCycleLabel(key){
  const [y,m] = key.split('-').map(Number);
  return MONTH_ABBR[m-1] + '/' + String(y).slice(2);
}
function shiftKey(key, delta){
  const [y,m] = key.split('-').map(Number);
  let newM = m+delta, newY = y;
  while(newM>12){ newM-=12; newY+=1; }
  while(newM<1){ newM+=12; newY-=1; }
  return newY+'-'+String(newM).padStart(2,'0');
}

// ---------- utilidades ----------
function fmtBRL(n){ return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toCents(n){ return Math.round(Number(n||0)*100); }
function fromCents(c){ return c/100; }
function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function catColor(idx){ return CAT_COLORS[idx % CAT_COLORS.length]; }
function catColorFor(c, idx){ return (c && c.color) || catColor(idx); }
function catIcon(c){ return (c && c.icon) || DEFAULT_CAT_ICON; }
function fixedIcon(f){ return (f && f.icon) || DEFAULT_FIXED_ICON; }
function statusColor(spent, limit){
  if(limit <= 0) return 'var(--text-dim)';
  const pct = spent/limit;
  if(pct >= 1) return 'var(--over)';
  if(pct >= 0.8) return 'var(--warn)';
  return 'var(--ok)';
}

// ---------- armazenamento ----------
const STORE_PREFIX = 'gastos_app:';

function checkStorageAvailable(){
  try{
    const testKey = STORE_PREFIX+'__test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){ return false; }
}
function showToast(msg, isError){
  const el = document.getElementById('statusMsg');
  if(!el) return;
  el.textContent = msg;
  el.className = 'status ' + (isError ? 'err' : 'ok');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.textContent=''; el.className='status'; }, 2500);
}
async function loadConfig(){
  try{
    const raw = localStorage.getItem(STORE_PREFIX+'config');
    if(raw) config = JSON.parse(raw);
  }catch(e){ /* no config yet */ }
}
async function saveConfig(){
  if(!storageAvailable){ showToast('Não foi possível salvar — armazenamento indisponível', true); return; }
  try{ localStorage.setItem(STORE_PREFIX+'config', JSON.stringify(config)); }
  catch(e){ showToast('Falha ao salvar configuração', true); }
}
async function loadTx(month){
  if(txByMonth[month]) return txByMonth[month];
  try{
    const raw = localStorage.getItem(STORE_PREFIX+'tx:'+month);
    txByMonth[month] = raw ? JSON.parse(raw) : [];
  }catch(e){ txByMonth[month] = []; }
  return txByMonth[month];
}
async function saveTx(month){
  if(!storageAvailable){ showToast('Não foi possível salvar — armazenamento indisponível', true); return; }
  try{ localStorage.setItem(STORE_PREFIX+'tx:'+month, JSON.stringify(txByMonth[month])); }
  catch(e){ showToast('Falha ao salvar lançamentos', true); }
}
function getAllTxMonthsFromStorage(){
  const months = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(STORE_PREFIX+'tx:')) months.push(k.slice((STORE_PREFIX+'tx:').length));
  }
  return months;
}
async function exportData(){
  const months = getAllTxMonthsFromStorage();
  const allTx = {};
  for(const m of months){ allTx[m] = await loadTx(m); }
  const payload = { exportedAt: new Date().toISOString(), config, transactions: allTx };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gastos-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  showToast('Exportação iniciada — verifique a tela de compartilhamento', false);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.config || !Array.isArray(data.config.categories) || !Array.isArray(data.config.fixed)){
        showToast('Arquivo inválido: estrutura de configuração não reconhecida', true);
        return;
      }
      if(!confirm('Importar vai substituir os dados atuais salvos neste iPhone. Continuar?')) return;
      config = data.config;
      await saveConfig();
      txByMonth = {};
      const transactions = data.transactions || {};
      for(const month of Object.keys(transactions)){
        txByMonth[month] = transactions[month];
        await saveTx(month);
      }
      showToast('Dados importados com sucesso', false);
      render();
    }catch(err){ showToast('Falha ao ler o arquivo: JSON inválido', true); }
  };
  reader.readAsText(file);
}

// ---------- cálculo do ciclo atual ----------
async function computeCurrentCycleTotals(){
  const tx = await loadTx(currentMonth);
  const fixedTotalC = config.fixed.reduce((s,f)=>s+toCents(f.amount),0);
  const catLimitTotalC = config.categories.reduce((s,c)=>s+toCents(c.limit),0);
  const totalBudgetC = fixedTotalC + catLimitTotalC;
  const catSpentC = {};
  config.categories.forEach(c=>catSpentC[c.id]=0);
  let allTxTotalC = 0;
  tx.forEach(t=>{
    const c = toCents(t.amount);
    allTxTotalC += c;
    if(catSpentC[t.categoryId]!==undefined) catSpentC[t.categoryId]+=c;
  });
  const catSpentTotalC = Object.values(catSpentC).reduce((a,b)=>a+b,0);
  const orphanedTotalC = allTxTotalC - catSpentTotalC;
  const totalSpentC = fixedTotalC + allTxTotalC;
  const remainingC = totalBudgetC - totalSpentC;
  return { tx, fixedTotalC, catLimitTotalC, totalBudgetC, catSpentC, orphanedTotalC, totalSpentC, remainingC };
}

// ---------- série histórica (para o gráfico comparativo) ----------
async function computeCycleSeries(numCycles, anchorKey){
  const series = [];
  for(let i=numCycles-1;i>=0;i--){
    const key = shiftKey(anchorKey, -i);
    const tx = await loadTx(key);
    const fixedC = config.fixed.reduce((s,f)=>s+toCents(f.amount),0);
    const catTotalsC = {};
    config.categories.forEach(c=>catTotalsC[c.id]=0);
    let orphanC = 0;
    tx.forEach(t=>{
      const c = toCents(t.amount);
      if(catTotalsC[t.categoryId]!==undefined) catTotalsC[t.categoryId]+=c;
      else orphanC += c;
    });
    const catSum = Object.values(catTotalsC).reduce((a,b)=>a+b,0);
    const totalC = fixedC + catSum + orphanC;
    series.push({ key, label: shortCycleLabel(key), fixedC, catTotalsC, orphanC, totalC });
  }
  return series;
}

// ---------- gráficos SVG (sem dependência externa) ----------
function buildDonutSVG(fixedC, catSpentC, orphanC){
  const catData = config.categories.map((c,i)=>({ id:c.id, spentC: catSpentC[c.id]||0, color: catColorFor(c,i) }));
  const total = fixedC + orphanC + catData.reduce((s,c)=>s+c.spentC,0);
  const r=64, cx=84, cy=84, sw=20;
  const circumference = 2*Math.PI*r;
  let offset=0, arcs='';
  const segs = [];
  if(fixedC>0) segs.push(fixedC);
  catData.forEach(c=>{ if(c.spentC>0) segs.push(c.spentC); });
  const colorsInOrder = [];
  if(fixedC>0) colorsInOrder.push('#767B87');
  catData.forEach(c=>{ if(c.spentC>0) colorsInOrder.push(c.color); });
  if(orphanC>0){ segs.push(orphanC); colorsInOrder.push('#B0B4BC'); }
  if(total<=0){
    arcs = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+sw+'"/>';
  } else {
    segs.forEach((valueC,idx)=>{
      const len=(valueC/total)*circumference;
      arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorsInOrder[idx]+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+circumference.toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'"/>';
      offset += len;
    });
  }
  return '<svg viewBox="0 0 168 168" width="168" height="168" style="flex-shrink:0;">'+
    '<g transform="rotate(-90 '+cx+' '+cy+')">'+arcs+'</g>'+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-family="var(--mono)" font-size="14" fill="var(--text)" font-weight="600">'+escapeHtml(fmtBRL(fromCents(total)))+'</text>'+
    '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-family="var(--sans)" font-size="9" fill="var(--text-dim)">gasto no ciclo</text>'+
  '</svg>';
}
function donutLegendHtml(fixedC, catSpentC, orphanC, total){
  const rows = [];
  if(fixedC>0) rows.push({icon:'📌', name:'Gastos fixos', color:'#767B87', valueC:fixedC});
  config.categories.forEach((c,i)=>{
    const v = catSpentC[c.id]||0;
    if(v>0) rows.push({icon:catIcon(c), name:c.name, color:catColorFor(c,i), valueC:v});
  });
  if(orphanC>0) rows.push({icon:'❓', name:'Categoria excluída', color:'#B0B4BC', valueC:orphanC});
  if(rows.length===0) return '<div class="empty">Nada registrado neste ciclo ainda.</div>';
  return '<div class="legend">'+rows.map(r=>{
    const pct = total>0 ? (r.valueC/total*100).toFixed(0) : 0;
    return '<div class="legend-row"><span class="legend-dot" style="background:'+r.color+'"></span><span class="legend-icon">'+r.icon+'</span><span class="legend-name">'+escapeHtml(r.name)+'</span><span class="legend-val">'+escapeHtml(fmtBRL(fromCents(r.valueC)))+' · '+pct+'%</span></div>';
  }).join('')+'</div>';
}
function buildComparisonSVG(series, activeKey){
  const width=320, height=190, padBottom=26, padTop=24, padX=8, gap=10;
  const n = series.length;
  const barW = (width - padX*2 - gap*(n-1)) / n;
  const maxTotal = Math.max(1, ...series.map(s=>s.totalC));
  const chartH = height-padBottom-padTop;
  let bars = '';
  series.forEach((s,i)=>{
    const x = padX + i*(barW+gap);
    const isActive = s.key === activeKey;
    let y = height-padBottom;
    const stackTop0 = y;
    const segs = [];
    if(s.fixedC>0) segs.push({c:s.fixedC, color:'#767B87'});
    config.categories.forEach((cat,ci)=>{
      const v = s.catTotalsC[cat.id]||0;
      if(v>0) segs.push({c:v, color:catColorFor(cat,ci)});
    });
    if(s.orphanC>0) segs.push({c:s.orphanC, color:'#B0B4BC'});
    if(isActive){
      bars += '<rect x="'+(x-3).toFixed(1)+'" y="'+(padTop-14).toFixed(1)+'" width="'+(barW+6).toFixed(1)+'" height="'+(chartH+14+16).toFixed(1)+'" fill="rgba(75,87,196,0.10)" rx="6"/>';
    }
    segs.forEach(seg=>{
      const h = (seg.c/maxTotal)*chartH;
      y -= h;
      bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" fill="'+seg.color+'" rx="2"/>';
    });
    if(isActive && stackTop0>y){
      bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+(stackTop0-y).toFixed(1)+'" fill="none" stroke="var(--accent)" stroke-width="2" rx="2"/>';
    }
    const valueLabel = s.totalC>0 ? fmtBRL(fromCents(s.totalC)).replace('R$','').trim() : '–';
    bars += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-6>10?y-6:10).toFixed(1)+'" font-size="8" fill="'+(isActive?'var(--accent)':'var(--text-dim)')+'" text-anchor="middle" font-family="var(--mono)" font-weight="'+(isActive?'700':'400')+'">'+escapeHtml(valueLabel)+'</text>';
    bars += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(height-10)+'" font-size="9" fill="'+(isActive?'var(--accent)':'var(--text-dim)')+'" text-anchor="middle" font-family="var(--mono)" font-weight="'+(isActive?'700':'400')+'">'+escapeHtml(s.label)+'</text>';
    // área tocável cobrindo toda a coluna, mesmo em ciclos vazios (sem barra visível)
    bars += '<rect class="cycle-hit" data-cycle-jump="'+s.key+'" x="'+(x-gap/2).toFixed(1)+'" y="0" width="'+(barW+gap).toFixed(1)+'" height="'+height+'" fill="transparent" style="cursor:pointer;"/>';
  });
  return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;">'+bars+'</svg>';
}

// ---------- renderização ----------
async function render(){
  if(!storageAvailable) storageAvailable = checkStorageAvailable();
  const app = document.getElementById('app');
  const bannerHtml = !storageAvailable ? '<div class="banner">⚠ Este navegador não está permitindo salvar dados (modo privado do Safari?). Nada será lembrado ao fechar o app.</div>' : '';
  const headerHtml = (currentTab==='overview' || currentTab==='log') ? renderHeaderHtml() : '';

  let contentHtml = '';
  if(currentTab==='overview') contentHtml = await renderOverviewHtml();
  else if(currentTab==='log') contentHtml = await renderLogHtml();
  else contentHtml = renderCategoriesHtml();

  app.innerHTML = bannerHtml + headerHtml + contentHtml + '<div class="status" id="statusMsg"></div>' + renderTabBarHtml();

  wireCommonEvents();
  if(currentTab==='overview') wireOverviewEvents();
  else if(currentTab==='log') wireLogEvents();
  else wireCategoriesEvents();
}

async function renderOverviewHtml(){
  const d = await computeCurrentCycleTotals();
  const fixedTotal = fromCents(d.fixedTotalC), totalBudget = fromCents(d.totalBudgetC),
        totalSpent = fromCents(d.totalSpentC), remaining = fromCents(d.remainingC),
        orphanedTotal = fromCents(d.orphanedTotalC);

  const gaugeHtml =
    '<div class="gauge-wrap"><div class="gauge">'+
    (d.totalBudgetC>0 ? '<div class="gauge-seg gauge-fixed" style="width:'+(d.fixedTotalC/d.totalBudgetC*100).toFixed(2)+'%"></div>' : '')+
    config.categories.map((c,i)=>{
      const w = d.totalBudgetC>0 ? (toCents(c.limit)/d.totalBudgetC*100) : 0;
      return '<div class="gauge-seg" style="width:'+w.toFixed(2)+'%;background:'+catColorFor(c,i)+'"></div>';
    }).join('')+
    '</div><div class="totals">'+
    '<div class="item"><span class="label">Orçado</span><span class="value">'+fmtBRL(totalBudget)+'</span></div>'+
    '<div class="item"><span class="label">Gasto</span><span class="value">'+fmtBRL(totalSpent)+'</span></div>'+
    '<div class="item"><span class="label">Resta</span><span class="value remaining '+(remaining<0?'neg':'pos')+'">'+fmtBRL(remaining)+'</span></div>'+
    '</div>'+
    (orphanedTotal>0 ? '<div class="field-error show" style="text-align:right;margin-top:6px;color:var(--text-dim);">inclui '+fmtBRL(orphanedTotal)+' de categoria(s) excluída(s)</div>' : '')+
    '</div>';

  const donutHtml = '<section><div class="section-title"><h2>Panorama do ciclo</h2></div>'+
    '<div class="chart-card"><div class="donut-row">'+
    buildDonutSVG(d.fixedTotalC, d.catSpentC, d.orphanedTotalC)+
    donutLegendHtml(d.fixedTotalC, d.catSpentC, d.orphanedTotalC, d.totalSpentC)+
    '</div></div></section>';

  const series = await computeCycleSeries(6, REAL_CURRENT_CYCLE);
  const comparisonHtml = '<section><div class="section-title"><h2>Comparativo entre ciclos</h2></div>'+
    '<div class="chart-card">'+buildComparisonSVG(series, currentMonth)+
    '<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Toque numa barra para ver os detalhes daquele ciclo. Últimos 6 ciclos fixos (não se movem ao navegar) — limites usados na comparação são os atuais, ciclos antigos não guardam o limite que valia na época.</div>'+
    '</div></section>';

  const catCardsHtml = config.categories.length===0 ? '<div class="empty">Nenhuma categoria ainda. Crie na aba Categorias.</div>' :
    '<div class="cat-grid">'+config.categories.map((c,i)=>{
      const spentC = d.catSpentC[c.id]||0;
      const limitC = toCents(c.limit);
      const spent = fromCents(spentC), limit = fromCents(limitC);
      const pct = limitC>0 ? Math.min(spentC/limitC*100,100) : 0;
      const remC = limitC - spentC;
      return '<div class="cat-card"><div class="cat-top">'+
        '<span class="cat-name"><span class="cat-color-dot" style="background:'+catColorFor(c,i)+'"></span>'+catIcon(c)+' '+escapeHtml(c.name)+'</span>'+
        '<span class="cat-nums">'+fmtBRL(spent)+' / '+fmtBRL(limit)+'</span></div>'+
        '<div class="cat-bar"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+statusColor(spent,limit)+'"></div></div>'+
        '<div class="cat-remain">'+(remC>=0? 'restam '+fmtBRL(fromCents(remC)) : 'estourou '+fmtBRL(Math.abs(fromCents(remC))))+'</div></div>';
    }).join('')+'</div>';

  const fixedHtml = config.fixed.length===0 ? '' : '<section><div class="section-title"><h2>Gastos fixos</h2></div><div class="fixed-list">'+
    config.fixed.map(f=>'<div class="fixed-row"><span>'+fixedIcon(f)+' '+escapeHtml(f.name)+'</span><span class="amt">'+fmtBRL(Number(f.amount||0))+'</span></div>').join('')+
    '</div></section>';

  return gaugeHtml + donutHtml + comparisonHtml +
    '<section><div class="section-title"><h2>Categorias</h2></div>'+catCardsHtml+'</section>'+
    fixedHtml;
}

  return '<div class="icon-picker-wrap">'+
    '<button type="button" class="icon-btn" data-icon-toggle="'+targetKey+'">'+currentIcon+'</button>'+
    (isOpen ? '<div class="icon-grid">'+EMOJI_CHOICES.map(e=>'<button type="button" class="icon-opt" data-icon-pick="'+targetKey+'" data-icon-val="'+e+'">'+e+'</button>').join('')+'</div>' : '')+
    '</div>';
}

function colorPickerHtml(targetKey, currentColor){
  const isOpen = colorPickerFor === targetKey;
  return '<div class="color-picker-wrap">'+
    '<button type="button" class="color-btn" data-color-toggle="'+targetKey+'" style="background:'+currentColor+'" aria-label="Escolher cor"></button>'+
    (isOpen ? '<div class="color-grid">'+CAT_COLORS.map(col=>'<button type="button" class="color-opt" data-color-pick="'+targetKey+'" data-color-val="'+col+'" style="background:'+col+'"></button>').join('')+'</div>' : '')+
    '</div>';
}

function renderCategoriesHtml(){
  const catListHtml = config.categories.map((c,i)=>
    '<div class="settings-item">'+
    iconPickerHtml(c.id, catIcon(c))+
    colorPickerHtml(c.id, catColorFor(c,i))+
    '<input class="sname" data-id="'+c.id+'" data-field="name" value="'+escapeHtml(c.name)+'">'+
    '<input class="slimit" type="number" data-id="'+c.id+'" data-field="limit" value="'+c.limit+'">'+
    '<button class="del-btn" data-del-cat="'+c.id+'">✕</button>'+
    '</div>'
  ).join('');

  const fixedListHtml = config.fixed.map(f=>
    '<div class="settings-item">'+
    iconPickerHtml(f.id, fixedIcon(f))+
    '<input class="sname" data-id="'+f.id+'" data-field="name" value="'+escapeHtml(f.name)+'">'+
    '<input class="slimit" type="number" data-id="'+f.id+'" data-field="amount" value="'+f.amount+'">'+
    '<button class="del-btn" data-del-fixed="'+f.id+'">✕</button>'+
    '</div>'
  ).join('');

  return '<section><div class="section-title"><h2>Categorias e limites</h2></div>'+
    '<div class="settings-block">'+
    '<div id="catSettingsList">'+catListHtml+'</div>'+
    '<div class="add-row">'+
    iconPickerHtml('new-cat', pendingNewCatIcon)+
    colorPickerHtml('new-cat', pendingNewCatColor)+
    '<input class="aname" id="newCatName" type="text" placeholder="Nova categoria" value="'+escapeHtml(pendingNewCatName)+'">'+
    '<input class="alimit" id="newCatLimit" type="number" placeholder="Limite" value="'+escapeHtml(pendingNewCatLimit)+'">'+
    '<button class="add-btn" id="addCatBtn">Adicionar</button>'+
    '</div></div>'+
    '<div class="settings-block"><h3>Gastos fixos mensais</h3>'+
    '<div id="fixedSettingsList">'+fixedListHtml+'</div>'+
    '<div class="add-row">'+
    iconPickerHtml('new-fixed', pendingNewFixedIcon)+
    '<input class="aname" id="newFixedName" type="text" placeholder="Nome (ex: aluguel)" value="'+escapeHtml(pendingNewFixedName)+'">'+
    '<input class="alimit" id="newFixedAmt" type="number" placeholder="Valor" value="'+escapeHtml(pendingNewFixedAmt)+'">'+
    '<button class="add-btn" id="addFixedBtn">Adicionar</button>'+
    '</div></div>'+
    '<div class="settings-block"><h3>Backup</h3><div class="backup-row">'+
    '<button id="exportBtn">Exportar backup</button>'+
    '<button id="importBtn">Importar backup</button>'+
    '<input type="file" id="importFile" accept="application/json" style="display:none;">'+
    '</div></div></section>';
}

// ---------- wiring de eventos ----------
function wireCommonEvents(){
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.onclick = ()=>{ currentTab = btn.dataset.tab; iconPickerFor=null; colorPickerFor=null; editingTxId=null; render(); };
  });
  const backToToday = document.getElementById('backToToday');
  if(backToToday) backToToday.onclick = ()=>{ currentMonth = REAL_CURRENT_CYCLE; render(); };
  document.querySelectorAll('[data-icon-toggle]').forEach(btn=>{
    btn.onclick = ()=>{ iconPickerFor = (iconPickerFor===btn.dataset.iconToggle) ? null : btn.dataset.iconToggle; colorPickerFor=null; render(); };
  });
  document.querySelectorAll('[data-icon-pick]').forEach(btn=>{
    btn.onclick = async ()=>{
      const target = btn.dataset.iconPick, val = btn.dataset.iconVal;
      if(target==='new-cat'){ pendingNewCatIcon = val; }
      else if(target==='new-fixed'){ pendingNewFixedIcon = val; }
      else {
        const cat = config.categories.find(c=>c.id===target);
        if(cat){ cat.icon = val; await saveConfig(); }
        else {
          const f = config.fixed.find(x=>x.id===target);
          if(f){ f.icon = val; await saveConfig(); }
        }
      }
      iconPickerFor = null;
      render();
    };
  });
  document.querySelectorAll('[data-color-toggle]').forEach(btn=>{
    btn.onclick = ()=>{ colorPickerFor = (colorPickerFor===btn.dataset.colorToggle) ? null : btn.dataset.colorToggle; iconPickerFor=null; render(); };
  });
  document.querySelectorAll('[data-color-pick]').forEach(btn=>{
    btn.onclick = async ()=>{
      const target = btn.dataset.colorPick, val = btn.dataset.colorVal;
      if(target==='new-cat'){ pendingNewCatColor = val; }
      else {
        const cat = config.categories.find(c=>c.id===target);
        if(cat){ cat.color = val; await saveConfig(); }
      }
      colorPickerFor = null;
      render();
    };
  });
}

function wireOverviewEvents(){
  const prevM = document.getElementById('prevM'), nextM = document.getElementById('nextM');
  if(prevM) prevM.onclick = ()=>changeMonth(-1);
  if(nextM) nextM.onclick = ()=>changeMonth(1);
  document.querySelectorAll('[data-cycle-jump]').forEach(el=>{
    el.onclick = ()=>jumpToCycle(el.dataset.cycleJump);
  });
}

async function jumpToCycle(key){
  if(key === currentMonth) return;
  currentMonth = key;
  await render();
  showToast('Mostrando ' + cycleLabel(key), false);
  window.scrollTo({top:0, behavior:'smooth'});
}

function wireLogEvents(){
  const prevM = document.getElementById('prevM'), nextM = document.getElementById('nextM');
  if(prevM) prevM.onclick = ()=>changeMonth(-1);
  if(nextM) nextM.onclick = ()=>changeMonth(1);
  const addBtn = document.getElementById('addTxBtn');
  if(addBtn && config.categories.length>0) addBtn.onclick = addTransaction;
  document.querySelectorAll('.tx-del').forEach(btn=>{ btn.onclick = ()=>deleteTransaction(btn.dataset.id); });
  document.querySelectorAll('[data-edit-open]').forEach(el=>{
    el.onclick = ()=>{ editingTxId = el.dataset.editOpen; render(); };
  });
  document.querySelectorAll('[data-cancel-edit]').forEach(btn=>{
    btn.onclick = ()=>{ editingTxId = null; render(); };
  });
  document.querySelectorAll('[data-save-edit]').forEach(btn=>{
    btn.onclick = ()=>saveEditedTransaction(btn.dataset.saveEdit);
  });
}

function wireCategoriesEvents(){
  document.getElementById('addCatBtn').onclick = addCategory;
  document.getElementById('addFixedBtn').onclick = addFixed;
  document.getElementById('exportBtn').onclick = exportData;
  document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{ if(e.target.files[0]) importData(e.target.files[0]); };

  document.getElementById('newCatName').oninput = (e)=>{ pendingNewCatName = e.target.value; };
  document.getElementById('newCatLimit').oninput = (e)=>{ pendingNewCatLimit = e.target.value; };
  document.getElementById('newFixedName').oninput = (e)=>{ pendingNewFixedName = e.target.value; };
  document.getElementById('newFixedAmt').oninput = (e)=>{ pendingNewFixedAmt = e.target.value; };

  document.querySelectorAll('#catSettingsList input').forEach(inp=>{
    inp.onchange = async ()=>{
      const c = config.categories.find(x=>x.id===inp.dataset.id);
      if(inp.dataset.field==='name') c.name = inp.value;
      else c.limit = Number(inp.value)||0;
      await saveConfig();
      render();
    };
  });
  document.querySelectorAll('[data-del-cat]').forEach(btn=>{
    btn.onclick = async ()=>{
      const cat = config.categories.find(c=>c.id===btn.dataset.delCat);
      const msg = 'Excluir "'+cat.name+'"? Gastos já lançados nessa categoria continuam contando no total, mas deixam de aparecer agrupados por categoria.';
      if(!confirm(msg)) return;
      config.categories = config.categories.filter(c=>c.id!==btn.dataset.delCat);
      await saveConfig();
      showToast('Categoria excluída', false);
      render();
    };
  });

  document.querySelectorAll('#fixedSettingsList input').forEach(inp=>{
    inp.onchange = async ()=>{
      const f = config.fixed.find(x=>x.id===inp.dataset.id);
      if(inp.dataset.field==='name') f.name = inp.value;
      else f.amount = Number(inp.value)||0;
      await saveConfig();
      render();
    };
  });
  document.querySelectorAll('[data-del-fixed]').forEach(btn=>{
    btn.onclick = async ()=>{
      const f = config.fixed.find(x=>x.id===btn.dataset.delFixed);
      if(!confirm('Excluir o gasto fixo "'+f.name+'"?')) return;
      config.fixed = config.fixed.filter(f=>f.id!==btn.dataset.delFixed);
      await saveConfig();
      showToast('Gasto fixo excluído', false);
      render();
    };
  });
}

// ---------- CRUD ----------
async function changeMonth(delta){
  currentMonth = shiftKey(currentMonth, delta);
  await render();
}

async function addCategory(){
  const nameEl = document.getElementById('newCatName');
  const limitEl = document.getElementById('newCatLimit');
  const name = nameEl.value.trim();
  const limit = Number(limitEl.value)||0;
  if(!name) return;
  config.categories.push({id:uid(), name, limit, icon: pendingNewCatIcon, color: pendingNewCatColor});
  pendingNewCatIcon = DEFAULT_CAT_ICON;
  pendingNewCatColor = CAT_COLORS[config.categories.length % CAT_COLORS.length];
  pendingNewCatName = '';
  pendingNewCatLimit = '';
  await saveConfig();
  showToast('Categoria criada', false);
  render();
}

async function addFixed(){
  const nameEl = document.getElementById('newFixedName');
  const amtEl = document.getElementById('newFixedAmt');
  const name = nameEl.value.trim();
  const amount = Number(amtEl.value)||0;
  if(!name) return;
  config.fixed.push({id:uid(), name, amount, icon: pendingNewFixedIcon});
  pendingNewFixedIcon = DEFAULT_FIXED_ICON;
  pendingNewFixedName = '';
  pendingNewFixedAmt = '';
  await saveConfig();
  showToast('Gasto fixo criado', false);
  render();
}

async function addTransaction(){
  const categoryId = document.getElementById('txCategory').value;
  const amountRaw = document.getElementById('txAmount').value;
  const amount = Number(amountRaw);
  const description = document.getElementById('txDesc').value.trim();
  const date = document.getElementById('txDate').value || new Date().toISOString().slice(0,10);
  const errEl = document.getElementById('txFormError');
  if(!amountRaw || isNaN(amount) || amount<=0){
    errEl.textContent = 'Informe um valor maior que zero.';
    errEl.classList.add('show');
    return;
  }
  errEl.classList.remove('show');
  const tx = await loadTx(currentMonth);
  tx.push({id:uid(), categoryId, amount, description, date});
  await saveTx(currentMonth);
  showToast('Gasto registrado', false);
  render();
}

async function deleteTransaction(id){
  if(!confirm('Excluir este lançamento?')) return;
  const tx = await loadTx(currentMonth);
  txByMonth[currentMonth] = tx.filter(t=>t.id!==id);
  await saveTx(currentMonth);
  showToast('Lançamento excluído', false);
  render();
}

async function saveEditedTransaction(id){
  const categoryId = document.getElementById('editCategory-'+id).value;
  const amount = Number(document.getElementById('editAmount-'+id).value);
  const description = document.getElementById('editDesc-'+id).value.trim();
  const date = document.getElementById('editDate-'+id).value;
  if(!amount || amount<=0){ showToast('Valor inválido — edição não salva', true); return; }
  const tx = await loadTx(currentMonth);
  const t = tx.find(x=>x.id===id);
  if(t){ t.categoryId = categoryId; t.amount = amount; t.description = description; t.date = date; }
  await saveTx(currentMonth);
  editingTxId = null;
  showToast('Lançamento atualizado', false);
  render();
}

(async function init(){
  storageAvailable = checkStorageAvailable();
  await loadConfig();
  await render();
})();
</script>
